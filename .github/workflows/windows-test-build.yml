name: Windows-Testbuild

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_API: pyside6
      PYTHONPATH: src
      GALLIUM_DRIVER: llvmpipe
      QT_OPENGL: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Abhängigkeiten installieren
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5 pyinstaller==6.22.3
          python -m pip check
      - name: Geometrie und STEP testen
        run: python -m pytest -q
      - name: Portable Anwendung erstellen
        run: >-
          python -m PyInstaller --noconfirm --clean --console --onedir
          --name Precision-CAD --collect-all pyvista --collect-all pyvistaqt
          --collect-all vtkmodules --collect-all cadquery --collect-all OCP
          --exclude-module qtpy.QtDataVisualization --exclude-module PySide6.QtDataVisualization
          --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2
          src/main.py
      - name: Lizenzen und Quellcode beilegen
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/collect_licenses.py
          python tools/collect_sources.py
          python -m pip freeze | Out-File -Encoding utf8 dist/Precision-CAD/build-environment.txt
          git archive --format=zip --output=dist/Precision-CAD/source.zip HEAD
      - name: Versionskennung beilegen
        run: python tools/write_build_info.py
      - name: Software-OpenGL für den Windows-Testrechner einrichten
        uses: ssciwr/setup-mesa-dist-win@v2
        with:
          version: '23.3.3'
          build-type: release-msvc
          deployment-choice: '1'
      - name: Gepackte EXE starten und STEP-Rundlauf prüfen
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Precision-CAD/Precision-CAD.exe -ArgumentList '--smoke-test' -RedirectStandardOutput smoke-stdout.log -RedirectStandardError smoke-stderr.log -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Starttest nach 120 Sekunden abgebrochen' }
          if ($process.ExitCode -ne 0) { throw "EXE-Starttest fehlgeschlagen: $($process.ExitCode)" }
          if (-not (Test-Path smoke.png)) { throw 'Kein gerendertes Testbild' }
      - name: Testbild hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Testbild
          path: |
            smoke.png
            smoke-ui.png
            smoke-stdout.log
            smoke-stderr.log
          if-no-files-found: ignore
      - name: Windows-Download hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Precision-CAD-Windows-x64
          path: dist/Precision-CAD/
          if-no-files-found: error
          retention-days: 30

  publish-update:
    needs: windows-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Precision-CAD-Windows-x64
          path: portable
      - name: Öffentliches Update-Paket erstellen
        run: |
          cd portable
          zip -q -r ../Precision-CAD-Windows-x64.zip .
          cd ..
          sha256sum Precision-CAD-Windows-x64.zip > Precision-CAD-Windows-x64.zip.sha256
      - name: Download-Archiv und SHA-256-Prüfsumme verifizieren
        run: |
          unzip -t Precision-CAD-Windows-x64.zip
          sha256sum --check Precision-CAD-Windows-x64.zip.sha256
      - name: Geprüfte Testversion als GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Precision CAD – Testversion 0.5 (Build ${{ github.run_number }})
          make_latest: true
          prerelease: false
          body: |
            Experimentelle Windows-x64-Testversion. ZIP vollständig entpacken und Precision-CAD.exe starten.
            Mit Bohrungen, Radien/Fasen, Flächenneigung, Projektdateien, Normteil-Auswahl und interaktiven Zeichnungsmaßen.
            Automatische Tests und Starttest der gepackten EXE wurden bestanden.
            Anleitung und offene Punkte: https://github.com/franzsonner/Precision-CAD#readme
          files: |
            Precision-CAD-Windows-x64.zip
            Precision-CAD-Windows-x64.zip.sha256
          fail_on_unmatched_files: true
